# Mosquitto para o LABORATÓRIO: escuta em todas as interfaces (para o MQTT X
# rodando no host alcançar a VM) e aceita clientes anônimos.
#
# NÃO use assim em produção. Lá o mínimo é:
#   - TLS na porta 8883 (cafile/certfile/keyfile) ou mTLS (require_certificate true);
#   - autenticação (allow_anonymous false + password_file) e ACL por tópico (acl_file);
#   - nenhum listener em texto claro exposto fora do host.
#
# Uso: mosquitto -c config/mosquitto.conf -v

listener 1883 0.0.0.0
allow_anonymous true
